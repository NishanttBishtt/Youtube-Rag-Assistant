<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube RAG Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0b10;
      --bg-card: rgba(20, 21, 30, 0.6);
      --bg-input: rgba(30, 32, 48, 0.5);
      --primary: linear-gradient(135deg, #6366f1, #8b5cf6);
      --primary-hover: linear-gradient(135deg, #4f46e5, #7c3aed);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.15);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.4);
      --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --glass-blur: blur(12px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif;
    }

    body {
      width: 380px;
      max-height: 600px;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-y: auto;
      padding: 16px;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .clear-btn {
      width: auto;
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 6px;
      color: #fca5a5;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: none;
      transition: all 0.2s ease;
    }

    .clear-btn:hover {
      background: rgba(239, 68, 68, 0.1);
      border-color: #ef4444;
      color: #ef4444;
      box-shadow: none;
      transform: none;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      background: var(--primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
    }

    h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #ffffff, #d8b4fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--text-muted);
      transition: background-color 0.3s ease;
    }

    .status-dot.active {
      background-color: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    textarea {
      width: 100%;
      height: 80px;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      padding: 10px 12px;
      font-size: 13px;
      resize: none;
      outline: none;
      transition: all 0.2s ease;
    }

    textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.15);
    }

    textarea::placeholder {
      color: #6b7280;
    }

    button {
      width: 100%;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      color: white;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      background: var(--bg-input);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Loader */
    .loader-container {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px 0;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(139, 92, 246, 0.1);
      border-radius: 50%;
      border-top-color: #8b5cf6;
      animation: spin 1s linear infinite;
    }

    .loader-text {
      font-size: 12px;
      color: var(--text-muted);
      animation: pulse 1.5s ease-in-out infinite;
    }

    /* Chat bubble and answer card styles */
    .chat-bubble-user {
      align-self: flex-start;
      width: 100%;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 12px 12px 12px 0px;
      padding: 10px 12px;
      margin-bottom: 6px;
      margin-top: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .chat-bubble-user .question-prefix {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8b5cf6;
      margin-bottom: 3px;
    }

    .chat-bubble-user .question-content {
      font-size: 12.5px;
      line-height: 1.4;
      color: #e5e7eb;
    }

    .chat-answer-card {
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .answer-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .answer-text {
      font-size: 13px;
      line-height: 1.5;
      color: #e5e7eb;
      white-space: pre-line;
    }

    .sources-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .sources-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .timestamp-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: #d1d5db;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      width: auto;
      box-shadow: none;
    }

    .timestamp-btn:hover {
      background: rgba(16, 185, 129, 0.1);
      border-color: var(--accent);
      color: #10b981;
      transform: scale(1.03);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.15);
    }

    .timestamp-btn::before {
      content: "▶";
      font-size: 8px;
    }

    .error-container {
      display: none;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.07);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.4;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-main">
        <div class="logo-container">
          <div class="logo-icon">Y</div>
          <h1>YouTube RAG</h1>
        </div>
        <button id="clearBtn" class="clear-btn" style="display: none;">Clear Chat</button>
      </div>
      <div class="status-badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="videoId">Detecting YouTube video...</span>
      </div>
    </header>

    <!-- Chat History Container -->
    <div id="chatHistory" style="display: flex; flex-direction: column; gap: 4px;"></div>

    <!-- Loader -->
    <div class="loader-container" id="loader">
      <div class="spinner"></div>
      <div class="loader-text">Analyzing transcript...</div>
    </div>

    <!-- Error Box -->
    <div class="error-container" id="errorBox"></div>

    <!-- Main Card -->
    <div class="card" id="searchCard">
      <div class="input-group">
        <textarea id="questionInput" placeholder="Ask anything about the video..." disabled></textarea>
        <button id="askBtn" disabled>
          <span>Ask Assistant</span>
        </button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
